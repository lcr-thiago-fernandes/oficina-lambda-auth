name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    # ubuntu-latest tem Docker em execucao: os testes com Testcontainers (PostgreSQL) rodam aqui.
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test with coverage
        run: dotnet test --no-build --configuration Release --collect:"XPlat Code Coverage" --settings coverlet.runsettings --results-directory ./TestResults

      - name: Install ReportGenerator
        run: dotnet tool install -g dotnet-reportgenerator-globaltool --version 5.5.11

      - name: Generate coverage report
        run: |
          reportgenerator \
            -reports:"./TestResults/**/coverage.cobertura.xml" \
            -targetdir:"./TestResults/CoverageReport" \
            -reporttypes:"HtmlInline;TextSummary;Cobertura"

      - name: Show coverage summary
        run: cat ./TestResults/CoverageReport/Summary.txt

      - name: Enforce minimum coverage (80%)
        run: |
          line_rate=$(grep -oP 'Line coverage:\s*\K[0-9.]+' ./TestResults/CoverageReport/Summary.txt | head -1)
          echo "Coverage: $line_rate%"
          awk -v cov="$line_rate" 'BEGIN { if (cov+0 < 80) { print "FAIL: coverage below 80%"; exit 1 } else print "OK: coverage >= 80%" }'

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ./TestResults/CoverageReport
          if-no-files-found: error

      # Prova que o pacote que o Terraform vai subir e construivel (sem deploy).
      - name: Empacotar Lambdas
        run: ./scripts/empacotar.sh

      - name: List vulnerable packages
        run: dotnet list package --vulnerable --include-transitive || true

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: fmt
        run: terraform -chdir=terraform fmt -check -recursive
      # -backend=false: valida sintaxe/tipos sem S3 nem credenciais. O plan real e o CD.
      - name: init (sem backend)
        run: terraform -chdir=terraform init -backend=false
      - name: validate
        run: terraform -chdir=terraform validate

  paridade-documento:
    # ADR-019: Documento.cs e COPIA de oficina-app. Este job falha se os dois arquivos
    # divergirem em qualquer coisa alem da linha de namespace — e o "teste de paridade"
    # que atravessa a fronteira entre repositorios.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Comparar com oficina-app (develop)
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/Documento.original.cs \
            https://raw.githubusercontent.com/lcr-thiago-fernandes/oficina-app/develop/src/Oficina.Dominio/Clientes/Documento.cs
          if diff <(grep -v '^namespace ' /tmp/Documento.original.cs) \
                  <(grep -v '^namespace ' src/OficinaAuth.Dominio/Documento.cs); then
            echo "OK: Documento.cs identico ao do oficina-app (exceto namespace)."
          else
            echo "ERRO: Documento.cs divergiu do oficina-app. Copie o arquivo original e ajuste so o namespace." >&2
            exit 1
          fi

  codeql:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - uses: github/codeql-action/init@v3
        with:
          languages: csharp
          build-mode: autobuild
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:csharp"
